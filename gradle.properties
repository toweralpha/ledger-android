# JVM memory. The Kotlin compiler and R8 both need room; 2.5 GB is comfortable for a
# project this size and still builds on a machine with 8 GB of RAM.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
# Left off deliberately: the Kotlin and KSP plugins are not configuration-cache clean.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.incremental=true
